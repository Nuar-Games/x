name: Apply step 13.5 handoff

on:
  push:
    branches:
      - x1/step-13-5

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: x1/step-13-5
          fetch-depth: 0
      - name: Apply supplied step 13.5 patch
        shell: bash
        run: |
          cat .step135/part0.b64 .step135/part1.b64 .step135/part2.b64 .step135/part3.b64 .step135/part4.b64 | base64 -d > /tmp/x1-step-13-5.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am /tmp/x1-step-13-5.patch
          git push origin HEAD:x1/step-13-5
