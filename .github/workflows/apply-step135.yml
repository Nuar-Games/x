name: Cleanup step 13.5 transfer

on:
  push:
    branches:
      - x1/step-13-5

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: x1/step-13-5
          fetch-depth: 0
      - name: Remove temporary transfer files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .step135
          rm -f .github/workflows/apply-step135.yml .github/workflows/cleanup-step135.yml
          git add -A
          git commit -m "chore: remove step 13.5 transfer helpers"
          git push origin HEAD:x1/step-13-5
