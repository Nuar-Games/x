name: Restore reviewed lock

on:
  push:
    branches: [x2/local-match-host]
    paths: [.github/workflows/restore-reviewed-lock.yml]

permissions:
  actions: read
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: x2/local-match-host
      - name: Restore exact reviewed lockfile artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/10815855065/zip > /tmp/reviewed-lock.zip
          unzip -p /tmp/reviewed-lock.zip pnpm-lock.yaml > pnpm-lock.yaml
          test "$(git hash-object pnpm-lock.yaml)" = "4ebb57cf1a0e52871de4c0c98f478b78ca284eec"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "build: restore reviewed lockfile"
          git push origin HEAD:x2/local-match-host
